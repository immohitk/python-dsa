[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dsa-lab"
version = "0.1.0"
description = "A structured Python repository for learning and implementing data structures, algorithms, and problem-solving techniques."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohit Kumar" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["arrays*"]